name: Desktop integration

'on':
  workflow_call:
    inputs:
      use-tested-native:
        type: boolean
        default: false
  workflow_dispatch:
  schedule:
    # Weekly, Monday 03:17 UTC.
    - cron: '17 3 * * 1'

concurrency:
  group: desktop-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-integration:
    name: Desktop integration tests
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      VNotchNativeArtifactPath: ${{ github.workspace }}/artifacts/native/VNotch.Native.dll
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # actions/setup-dotnet@v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            packages.lock.json
            Tests/packages.lock.json
            Uninstall/packages.lock.json

      - name: Restore
        run: dotnet restore V-Notch.sln --locked-mode

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.use-tested-native
        with:
          name: tested-native
          path: artifacts/native
      - name: Build native source for standalone run
        if: ${{ !inputs.use-tested-native }}
        shell: pwsh
        run: ./Tools/New-NativeArtifact.ps1
      - name: Verify native source identity
        shell: pwsh
        run: ./Tools/Assert-NativeArtifact.ps1
      - name: Build
        run: dotnet build V-Notch.sln --configuration Release --no-restore -warnaserror -p:SkipNativeCompile=true

      - name: Prepare desktop and audio prerequisites
        shell: pwsh
        run: ./Tools/Initialize-DesktopTestRunner.ps1

      # Hosted VMs are disposable even though Windows reports UserInteractive=true.
      # Desktop.runsettings opts in; DesktopTestMode also verifies hosted-runner
      # identity, keeping visible tests disabled on local and self-hosted machines.
      - name: Test (desktop integration)
        shell: pwsh
        run: >-
          dotnet test Tests/VNotch.Tests.csproj --configuration Release --no-build --no-restore
          --settings Tests/Desktop.runsettings --results-directory artifacts/desktop-test-results
          --logger "trx;LogFileName=desktop-integration.trx" --logger "console;verbosity=normal"

      - name: Require executed desktop tests
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./Tools/Assert-DesktopTests.ps1 -ResultsDirectory artifacts/desktop-test-results

      - name: Retain desktop test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-test-results
          path: artifacts/desktop-test-results/**/*.trx
          if-no-files-found: error
          retention-days: 14
