name: CI

'on':
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ['v*']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  preflight:
    name: Secrets and pipeline checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test pipeline gates
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Scan history for secrets (Gitleaks 8.30.1)
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$tool_dir" artifacts/security .cache/gitleaks
          archive=".cache/gitleaks/gitleaks_8.30.1_linux_x64.tar.gz"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 --output "$archive" \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          fi
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          python .github/scripts/check_secret_scanner.py "$tool_dir/gitleaks"
          "$tool_dir/gitleaks" git . --log-opts=--all --config .gitleaks.toml \
            --gitleaks-ignore-path .gitleaksignore --redact=100 --no-banner \
            --report-format sarif --report-path artifacts/security/gitleaks.sarif

      - name: Retain redacted secret scan evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secret-scan
          path: artifacts/security/gitleaks.sarif
          if-no-files-found: error
          retention-days: 7

      - name: Determine Windows build scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
        run: python .github/scripts/ci_scope.py scope

  sast:
    name: CodeQL security analysis (${{ matrix.language }})
    needs: preflight
    if: needs.preflight.outputs.windows == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build_mode: none
            os: ubuntu-latest
          - language: c-cpp
            build_mode: manual
            os: windows-latest
    env:
      EnableWindowsTargeting: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      # github/codeql-action@v4; C# uses build-mode none, C++ traces the VNotch.Native build.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          queries: security-extended
          dependency-caching: true
          config: |
            paths-ignore:
              - artifacts
              - .codegraph

      - name: Build native DLL for C/C++ CodeQL tracing
        if: matrix.language == 'c-cpp'
        shell: pwsh
        run: |
          Remove-Item -LiteralPath Native/out/VNotch.Native.dll -Force -ErrorAction SilentlyContinue
          dotnet msbuild V-Notch.csproj -t:BuildNativeDll -p:Configuration=Release -p:NativeFastCompile=true -m
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath Native/out/VNotch.Native.dll)) {
            throw 'Failed to compile VNotch.Native.dll for CodeQL tracing.'
          }

      - name: Analyze and upload code scanning results
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: /language:${{ matrix.language }}
          output: artifacts/codeql

      - name: Reject CodeQL security findings
        run: python .github/scripts/check_sarif.py artifacts/codeql

      - name: Retain SAST evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: artifacts/codeql/*.sarif
          if-no-files-found: error
          retention-days: 7

  windows-validation:
    name: Windows validation
    needs: preflight
    if: needs.preflight.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-dotnet@v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            packages.lock.json
            Tests/packages.lock.json
            Uninstall/packages.lock.json

      - name: Restore
        run: dotnet restore V-Notch.sln --locked-mode -nologo -v:q

      - name: Verify model provenance and distribution allowlist
        shell: pwsh
        run: ./Tools/Assert-ModelAssets.ps1

      - name: Validate all locale keys and format placeholders
        run: python Tools/validate_locales.py

      - name: Build
        run: dotnet build V-Notch.sln --configuration Release --no-restore -warnaserror -nologo -v:q -clp:NoSummary -m -p:SkipNativeCompile=true

      - name: Run unit tests
        shell: pwsh
        run: >-
          ./scripts/t.ps1 -All -NoBuild -Configuration Release -Shards 4
          -BlameHangTimeoutSeconds 60 -ResultsDirectory artifacts/unit-test-results

      - name: Verify gates, update compatibility & package audit in parallel
        id: gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -LiteralPath V-Notch.csproj
          $version = [string]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          $repo = (Get-Location).Path
          $jobs = @(
            Start-Job -Name 'ReleaseGates' -ScriptBlock { param($r) Set-Location -LiteralPath $r; & "$r/Tests/ReleaseGateTests.ps1" } -ArgumentList $repo
            Start-Job -Name 'Compat193' -ScriptBlock { param($r) Set-Location -LiteralPath $r; & "$r/Tools/Assert-UpdateCompatibility.ps1" } -ArgumentList $repo
            Start-Job -Name 'CompatPromo' -ScriptBlock { param($r, $v) Set-Location -LiteralPath $r; & "$r/Tools/Assert-UpdateCompatibility.ps1" -ReleaseVersion $v -InstalledVersion "$v-beta.65534.65534+build.promotion-probe" } -ArgumentList $repo, $version
            Start-Job -Name 'PackageAudit' -ScriptBlock { param($r) Set-Location -LiteralPath $r; & "$r/Tools/Assert-PackageAudit.ps1" } -ArgumentList $repo
          )
          $null = Wait-Job -Job $jobs
          foreach ($job in $jobs) {
            Write-Host "=== [$($job.Name)] ==="
            Receive-Job -Job $job -ErrorAction Stop
            if ($job.State -ne 'Completed') {
              throw "Parallel CI check '$($job.Name)' failed with state $($job.State)."
            }
          }
          Remove-Job -Job $jobs -Force

      - name: Retain package audit evidence
        if: ${{ !cancelled() && steps.gates.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-audit
          path: artifacts/package-audit.json
          if-no-files-found: error
          retention-days: 7

  # Preserve the original required-check name while aggregating every gate.
  validate:
    needs: [preflight, sast, windows-validation]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require all applicable checks
        shell: bash
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          WINDOWS_REQUIRED: ${{ needs.preflight.outputs.windows }}
          SAST: ${{ needs.sast.result }}
          BUILD: ${{ needs.windows-validation.result }}
        run: |
          if [[ "$PREFLIGHT" != 'success' ]]; then
            echo 'Secret scanning or pipeline checks failed.' >&2
            exit 1
          fi
          if [[ "$WINDOWS_REQUIRED" == 'true' ]]; then
            for result in "$SAST" "$BUILD"; do
              if [[ "$result" != 'success' ]]; then
                echo 'A required security or Windows gate failed.' >&2
                exit 1
              fi
            done
          elif [[ "$WINDOWS_REQUIRED" != 'false' || "$SAST" != 'skipped' || "$BUILD" != 'skipped' ]]; then
            echo 'Invalid documentation-only validation state.' >&2
            exit 1
          fi
          echo 'All applicable CI gates passed.'
