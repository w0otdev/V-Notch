name: CI

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-dotnet@v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore V-Notch.sln

      - name: Verify format
        run: dotnet format V-Notch.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build V-Notch.sln --configuration Release --no-restore -warnaserror

      - name: Audit packages
        run: dotnet list V-Notch.sln package --vulnerable --include-transitive