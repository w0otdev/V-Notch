name: Release Installer

'on':
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-installer:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [framework-dependent, self-contained]
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # actions/setup-dotnet@v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build installer (${{ matrix.variant }})
        shell: pwsh
        run: |
          if ('${{ matrix.variant }}' -eq 'self-contained') {
            ./build-installer.ps1 -SelfContained
          } else {
            ./build-installer.ps1
          }

      - name: Name setup files
        id: artifact
        shell: pwsh
        run: |
          $out = if ('${{ matrix.variant }}' -eq 'self-contained') { 'V-Notch-Setup-SelfContained.exe' } else { 'V-Notch-Setup.exe' }
          if ($out -ne 'V-Notch-Setup.exe') { Copy-Item 'installers\V-Notch-Setup.exe' "installers\$out" -Force }
          $hash = (Get-FileHash -Algorithm SHA256 "installers\$out").Hash.ToLowerInvariant()
          Set-Content -Path "installers\$out.sha256" -Value "$hash  $out" -NoNewline
          "name=$out" >> $env:GITHUB_OUTPUT

      # actions/upload-artifact@v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            installers/${{ steps.artifact.outputs.name }}
            installers/${{ steps.artifact.outputs.name }}.sha256
          if-no-files-found: error

  release:
    needs: build-installer
    if: needs.build-installer.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/download-artifact@v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        run: |
          if [ "${{ startsWith(github.event.workflow_run.head_branch, 'v') }}" = "true" ]; then
            printf "Release %s from commit \`%s\`.\n\n- \`V-Notch-Setup.exe\` (requires [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0))\n- \`V-Notch-Setup-SelfContained.exe\` (runtime bundled)\n- SHA256 checksums are attached for verification.\n" "${{ github.event.workflow_run.head_branch }}" "${{ github.event.workflow_run.head_sha }}" > release-notes.md
            gh release create "${{ github.event.workflow_run.head_branch }}" release-assets/* \
              --title "V-Notch ${{ github.event.workflow_run.head_branch }}" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --latest \
              --notes-file release-notes.md
          else
            gh release delete nightly --cleanup-tag --yes || true
            gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/nightly || true
            sleep 2
            printf "Automated build from commit \`%s\` on branch \`%s\`.\n\n- \`V-Notch-Setup.exe\` (requires [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0))\n- \`V-Notch-Setup-SelfContained.exe\` (runtime bundled)\n- SHA256 checksums are attached for verification.\n" "${{ github.event.workflow_run.head_sha }}" "${{ github.event.workflow_run.head_branch }}" > release-notes.md
            gh release create nightly release-assets/* \
              --title "Nightly build (latest main)" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --prerelease \
              --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
