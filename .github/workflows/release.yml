name: Release Installer

'on':
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify-validation:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.validation.outputs.eligible }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      windows_version: ${{ steps.identity.outputs.windows_version }}
      informational_version: ${{ steps.identity.outputs.informational_version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Require Windows validation of this release commit
        id: validation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/$CI_RUN_ID/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/ci-jobs.json"
          python .github/scripts/ci_scope.py release "$RUNNER_TEMP/ci-jobs.json"

      - name: Allocate immutable release identity
        id: identity
        if: steps.validation.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python .github/scripts/release_version.py

  build-installer:
    needs: verify-validation
    if: needs.verify-validation.outputs.eligible == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: code-signing
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    strategy:
      fail-fast: false
      matrix:
        variant: [framework-dependent, self-contained]
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # actions/setup-dotnet@v4.3.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            packages.lock.json
            Tests/packages.lock.json
            Uninstall/packages.lock.json

      # actions/cache@v4; cache the publisher-verified portable archive only.
      - name: Restore NSIS portable cache
        id: nsis-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/nsis/nsis-3.12.zip
          key: ${{ runner.os }}-nsis-3.12-56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f

      - name: Verify and extract NSIS portable
        id: nsis
        shell: pwsh
        run: |
          $compiler = ./scripts/Initialize-Nsis.ps1 -CacheDirectory '.cache/nsis' -DestinationDirectory (Join-Path $env:RUNNER_TEMP 'nsis-portable')
          "makensis=$compiler" >> $env:GITHUB_OUTPUT

      # Save before signing so an unavailable identity does not lose the tool cache.
      - name: Save NSIS portable cache
        if: steps.nsis-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache/nsis/nsis-3.12.zip
          key: ${{ steps.nsis-cache.outputs.cache-primary-key }}

      - name: Build installer (${{ matrix.variant }})
        shell: pwsh
        env:
          VNOTCH_CODE_SIGNING_PFX_BASE64: ${{ secrets.VNOTCH_CODE_SIGNING_PFX_BASE64 }}
          VNOTCH_CODE_SIGNING_PASSWORD: ${{ secrets.VNOTCH_CODE_SIGNING_PASSWORD }}
          VNOTCH_CODE_SIGNING_THUMBPRINT: ${{ vars.VNOTCH_CODE_SIGNING_THUMBPRINT || secrets.VNOTCH_CODE_SIGNING_THUMBPRINT }}
          NSIS_MAKENSIS: ${{ steps.nsis.outputs.makensis }}
          RELEASE_VERSION: ${{ needs.verify-validation.outputs.version }}
          WINDOWS_VERSION: ${{ needs.verify-validation.outputs.windows_version }}
          INFORMATIONAL_VERSION: ${{ needs.verify-validation.outputs.informational_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rawThumbprint = $env:VNOTCH_CODE_SIGNING_THUMBPRINT
          $cleanThumbprint = if ($rawThumbprint) { ($rawThumbprint -replace '\s','' -replace '[^\da-fA-F]','') } else { '' }
          $hasCert = [bool]($env:VNOTCH_CODE_SIGNING_PFX_BASE64 -and $cleanThumbprint -match '^[a-fA-F0-9]{40}$')

          $certificateFile = Join-Path $env:RUNNER_TEMP 'vnotch-signing.pfx'
          $imported = @()
          try {
            $buildArguments = @{
              NsisPath = $env:NSIS_MAKENSIS; LockedRestore = $true
              ReleaseVersion = $env:RELEASE_VERSION; WindowsVersion = $env:WINDOWS_VERSION
              InformationalVersion = $env:INFORMATIONAL_VERSION
            }
            if ('${{ matrix.variant }}' -eq 'self-contained') { $buildArguments.SelfContained = $true }

            if ($hasCert) {
              Write-Host "Authenticode certificate detected. Importing and signing installer..." -ForegroundColor Green
              [IO.File]::WriteAllBytes($certificateFile, [Convert]::FromBase64String($env:VNOTCH_CODE_SIGNING_PFX_BASE64))
              $password = ConvertTo-SecureString -String $env:VNOTCH_CODE_SIGNING_PASSWORD -AsPlainText -Force
              $imported = @(Import-PfxCertificate -FilePath $certificateFile -CertStoreLocation Cert:\CurrentUser\My -Password $password)
              $buildArguments.CertificateThumbprint = $cleanThumbprint
              $buildArguments.RequireAuthenticode = $true
            } else {
              Write-Host "No Authenticode code-signing certificate configured (optional). Building unsigned installer." -ForegroundColor Yellow
            }

            ./scripts/b.ps1 @buildArguments
            if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          } finally {
            foreach ($certificate in $imported) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey -Force }
            if (Test-Path -LiteralPath $certificateFile) { Remove-Item -LiteralPath $certificateFile -Force }
          }

      - name: Name setup files
        id: artifact
        shell: pwsh
        run: |
          $out = if ('${{ matrix.variant }}' -eq 'self-contained') { 'V-Notch-Setup-SelfContained.exe' } else { 'V-Notch-Setup.exe' }
          if ($out -ne 'V-Notch-Setup.exe') { Copy-Item 'installers\V-Notch-Setup.exe' "installers\$out" -Force }
          $hash = (Get-FileHash -Algorithm SHA256 "installers\$out").Hash.ToLowerInvariant()
          Set-Content -Path "installers\$out.sha256" -Value "$hash  $out`n" -NoNewline

          $exeShaName = if ('${{ matrix.variant }}' -eq 'self-contained') { 'V-Notch-SelfContained.exe.sha256' } else { 'V-Notch.exe.sha256' }
          $appExeHash = (Get-FileHash -Algorithm SHA256 "release\V-Notch.exe").Hash.ToLowerInvariant()
          Set-Content -Path "installers\$exeShaName" -Value "$appExeHash  V-Notch.exe`n" -NoNewline

          "name=$out" >> $env:GITHUB_OUTPUT
          "app_checksum=$exeShaName" >> $env:GITHUB_OUTPUT

      # actions/upload-artifact@v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.artifact.outputs.name }}-${{ needs.verify-validation.outputs.tag }}
          path: |
            installers/${{ steps.artifact.outputs.name }}
            installers/${{ steps.artifact.outputs.name }}.sha256
            installers/${{ steps.artifact.outputs.app_checksum }}
          if-no-files-found: error
          retention-days: 7

  sign-updates:
    needs: [verify-validation, build-installer]
    if: needs.build-installer.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 15
    environment: update-signing
    steps:
      # Keep the signing secret in the protected update-signing environment.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: signed-assets
          pattern: V-Notch-Setup*-${{ needs.verify-validation.outputs.tag }}
          merge-multiple: true

      - name: Sign update manifests
        shell: pwsh
        env:
          VNOTCH_UPDATE_SIGNING_KEY_PEM: ${{ secrets.VNOTCH_UPDATE_SIGNING_KEY_PEM }}
          RELEASE_VERSION: ${{ needs.verify-validation.outputs.version }}
        run: |
          foreach ($name in @('V-Notch-Setup.exe', 'V-Notch-Setup-SelfContained.exe')) {
            ./scripts/Sign-UpdateManifest.ps1 -InstallerPath "signed-assets/$name" -Version $env:RELEASE_VERSION
          }

      - name: Verify signed release assets with the channel's updater
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.verify-validation.outputs.version }}
          IS_PRERELEASE: ${{ needs.verify-validation.outputs.prerelease }}
        run: ./Tools/Assert-UpdateCompatibility.ps1 -AssetsDirectory signed-assets -ReleaseVersion $env:RELEASE_VERSION -Prerelease:($env:IS_PRERELEASE -eq 'true')

      - name: Verify beta clients can upgrade to the signed stable release
        if: needs.verify-validation.outputs.prerelease == 'false'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.verify-validation.outputs.version }}
        run: ./Tools/Assert-UpdateCompatibility.ps1 -AssetsDirectory signed-assets -ReleaseVersion $env:RELEASE_VERSION -InstalledVersion "$($env:RELEASE_VERSION)-beta.65534.65534+build.promotion-probe"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-update-assets-${{ needs.verify-validation.outputs.tag }}
          path: signed-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [verify-validation, sign-updates]
    if: needs.sign-updates.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/download-artifact@v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-update-assets-${{ needs.verify-validation.outputs.tag }}
          path: release-assets
          merge-multiple: true

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          cat release-assets/*.sha256 > release-assets/checksums.txt
          printf 'Release %s from commit `%s`.\n\n- `V-Notch-Setup.exe` (requires [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0))\n- `V-Notch-Setup-SelfContained.exe` (runtime bundled)\n- Signed update manifests and SHA256 checksums are attached.\n' "$RELEASE_VERSION" "$HEAD_SHA" > release-notes.md
          if [ "$IS_PRERELEASE" = 'true' ]; then
            printf '\nBeta testing build. Enable pre-release updates in Settings to receive these builds.\nBuild: %s\n' "$INFORMATIONAL_VERSION" >> release-notes.md
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "V-Notch $RELEASE_VERSION (beta)" \
              --target "$HEAD_SHA" --prerelease --latest=false \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "V-Notch $RELEASE_VERSION" \
              --target "$HEAD_SHA" --latest \
              --notes-file release-notes.md
          fi
        env:
          # This job downloads artifacts without checkout, so gh cannot infer a repo from .git.
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.verify-validation.outputs.version }}
          RELEASE_TAG: ${{ needs.verify-validation.outputs.tag }}
          IS_PRERELEASE: ${{ needs.verify-validation.outputs.prerelease }}
          INFORMATIONAL_VERSION: ${{ needs.verify-validation.outputs.informational_version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

