<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64">
  <rect width="240" height="64" rx="10" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.2"/>

  <!-- Windows logo (black) -->
  <g transform="translate(18, 18)">
    <rect x="0" y="0" width="11.5" height="11.5" rx="1.5" fill="#111111"/>
    <rect x="13" y="0" width="11.5" height="11.5" rx="1.5" fill="#111111"/>
    <rect x="0" y="13" width="11.5" height="11.5" rx="1.5" fill="#111111"/>
    <rect x="13" y="13" width="11.5" height="11.5" rx="1.5" fill="#111111"/>
  </g>

  <!-- Text -->
  <text x="54" y="28" font-family="'SF Pro Display', 'SF Pro Text', -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#111111">Windows</text>
  <text x="54" y="44" font-family="'SF Pro Display', 'SF Pro Text', -apple-system, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#666666">Latest release</text>

  <!-- Download arrow -->
